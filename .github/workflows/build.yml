name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # Apple-Silicon only. GitHub's hosted Intel (macos-13) runners are being
    # retired and stall in the queue; re-add the x86_64 entry if needed.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout luma-backend submodule
        shell: bash
        run: |
          TOKEN="${GH_PAT:-$GITHUB_TOKEN}"
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install luma CLI and PyInstaller (venv)
        working-directory: luma-backend
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Install weasyprint system libraries
        run: brew install --quiet pango gdk-pixbuf

      - name: Fetch static ffmpeg/ffprobe
        run: |
          mkdir -p /tmp/ffbin
          for b in ffmpeg ffprobe; do
            curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/$b/zip" -o "/tmp/ffbin/$b.zip"
            unzip -oq "/tmp/ffbin/$b.zip" -d /tmp/ffbin
          done
          chmod +x /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe
          file /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe

      - name: Build luma sidecar
        working-directory: luma-backend
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          FFMPEG_DIR=/tmp/ffbin ./build_macos.sh arm64

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app bundle
        run: npm run tauri -- build --bundles app

      - name: Inject sidecar payload
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/luma.app"
          test -d "$APP"
          # PyInstaller's onedir bootloader resolves _MEIPASS to
          # Contents/Frameworks when the launcher runs inside a .app bundle,
          # so the whole payload (Python runtime, stdlib, ffmpeg, pango libs)
          # must live there — not next to the executable in Contents/MacOS.
          cp -R src-tauri/binaries/_internal/. "$APP/Contents/Frameworks/"
          # The main executable is already ad-hoc linker-signed; signing the
          # sidecar launcher is enough. Never code-sign the whole bundle: it
          # recurses into the payload and fails on the Python.framework layout.
          codesign --force --sign - "$APP/Contents/MacOS/luma-sidecar"

      - name: Free disk space before packaging
        shell: bash
        run: |
          # The .app bundle is already assembled; hdiutil UDZO needs ~2x the
          # bundle size on top of the workspace, and hosted runners run tight.
          # Drop big intermediates from both the workspace and the tool caches
          # that share the same volume.
          rm -rf node_modules
          rm -rf src-tauri/target/release/build src-tauri/target/release/deps \
                 src-tauri/target/release/.fingerprint src-tauri/target/release/incremental \
                 src-tauri/target/debug
          rm -rf luma-backend/.venv luma-backend/build luma-backend/luma.egg-info \
                 luma-backend/ffmpeg luma-backend/ffprobe 2>/dev/null || true
          rm -rf "${UV_CACHE_DIR:-/Users/runner/work/_temp/setup-uv-cache}" 2>/dev/null || true
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache" 2>/dev/null || true
          df -h "$(pwd)" | tail -1

      - name: Package DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/luma.app"
          # Keep installers out of the frontend `dist/` (vite) directory.
          mkdir -p artifacts
          ditto -c -k --keepParent "$APP" "artifacts/luma-darwin-arm64.zip"
          hdiutil create -volname luma -srcfolder "$APP" -ov -format UDZO "artifacts/luma-darwin-arm64.dmg"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luma-darwin-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true