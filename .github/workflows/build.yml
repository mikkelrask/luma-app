name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64, suffix: darwin-arm64 }
          - { runner: macos-13, arch: x86_64, suffix: darwin-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout luma-backend submodule
        shell: bash
        run: |
          TOKEN="${GH_PAT:-$GITHUB_TOKEN}"
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install luma CLI and PyInstaller (venv)
        working-directory: luma-backend
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Install weasyprint system libraries
        run: brew install --quiet pango gdk-pixbuf

      - name: Fetch static ffmpeg/ffprobe
        run: |
          mkdir -p /tmp/ffbin
          for b in ffmpeg ffprobe; do
            curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/$b/zip" -o "/tmp/ffbin/$b.zip"
            unzip -oq "/tmp/ffbin/$b.zip" -d /tmp/ffbin
          done
          chmod +x /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe
          file /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe

      - name: Build luma sidecar
        working-directory: luma-backend
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          FFMPEG_DIR=/tmp/ffbin ./build_macos.sh ${{ matrix.arch }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app bundle
        run: npm run tauri -- build --bundles app

      - name: Inject sidecar payload
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/luma.app"
          test -d "$APP"
          cp -R src-tauri/binaries/_internal "$APP/Contents/MacOS/_internal"
          # Ad-hoc sign only the top-level executables. Deep-signing the whole
          # bundle recurses into the PyInstaller payload and fails on the
          # Python.framework layout, and the bundled payload already runs
          # unsigned (PyInstaller's macOS binaries are not code-signed).
          MAIN_BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 ! -name 'luma-sidecar' -print -quit)"
          test -n "$MAIN_BIN"
          codesign --force --sign - "$MAIN_BIN"
          codesign --force --sign - "$APP/Contents/MacOS/luma-sidecar"

      - name: Package DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/luma.app"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/luma-${{ matrix.suffix }}.zip"
          hdiutil create -volname luma -srcfolder "$APP" -ov -format UDZO "dist/luma-${{ matrix.suffix }}.dmg"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luma-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true